[package]
name = "ascension"
version = "0.1.0"
description = "An offline workspace for a saved next action"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ascension_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
rfd = "=0.17.2"
tempfile = "=3.27.0"
sha2 = "=0.10.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
